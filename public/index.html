<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fraza Board — Профессиональная музыкальная доска</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #141416; color: #fff; }
    
    #board-container { width: 100vw; height: 100vh; position: relative; cursor: crosshair; }
    canvas { display: block; position: absolute; top: 0; left: 0; }

    /* Панель инструментов */
    .toolbar {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(26, 26, 32, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 16px;
      border-radius: 35px;
      display: flex;
      gap: 10px;
      align-items: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      z-index: 100;
    }

    .tool-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: #e2e8f0;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tool-btn:hover {
      background: rgba(255,255,255,0.2);
      transform: translateY(-1px);
    }

    .tool-btn.active {
      background: #6366f1;
      border-color: #818cf8;
      color: #fff;
    }

    .divider { width: 1px; height: 24px; background: rgba(255,255,255,0.15); }

    /* Подсказка снизу */
    .hint {
      position: fixed;
      bottom: 16px;
      left: 20px;
      background: rgba(0,0,0,0.75);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      color: #94a3b8;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <button class="tool-btn active" id="btn-draw" onclick="setMode('draw')">✏️ Карандаш</button>
    <button class="tool-btn" id="btn-eraser" onclick="setMode('eraser')">🧹 Ластик</button>
    <div class="divider"></div>
    <button class="tool-btn" onclick="addShape('vibrato')">〰️ Вибрато</button>
    <button class="tool-btn" onclick="addShape('glissando')">↗️ Глиссандо</button>
    <button class="tool-btn" onclick="addShape('piano')">🎹 p (Тише)</button>
    <button class="tool-btn" onclick="addShape('forte')">🔊 f (Громче)</button>
    <button class="tool-btn" onclick="addShape('accent')">❯ Акцент</button>
    <div class="divider"></div>
    <button class="tool-btn" onclick="clearBoard()" style="color: #ef4444;">🗑 Очистить</button>
  </div>

  <div class="hint">
    🖼 Перетащите скриншот в любое место | 🔍 Зум: Колесико / Тачпад | ✋ Перемещение: Пробел + Зажать мышь
  </div>

  <div id="board-container">
    <canvas id="board"></canvas>
  </div>

  <script src="resize.js"></script>
  <script src="app.js"></script>
</body>
</html>
