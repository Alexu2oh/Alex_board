<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fraza Board — Pro Vocal Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f13; color: #f8fafc; }
    
    #board-container { width: 100vw; height: 100vh; position: relative; cursor: default; }
    canvas { display: block; position: absolute; top: 0; left: 0; }

    /* Верхняя панель управления */
    .toolbar {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 28, 0.92);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 16px;
      border-radius: 40px;
      display: flex;
      gap: 12px;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7);
      z-index: 100;
      max-width: 95vw;
      overflow-x: auto;
    }

    .tool-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .tool-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: #cbd5e1;
      padding: 7px 12px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .tool-btn:hover { background: rgba(255,255,255,0.18); color: #fff; transform: translateY(-1px); }
    .tool-btn.active { background: #6366f1; border-color: #818cf8; color: #fff; }

    .divider { width: 1px; height: 26px; background: rgba(255,255,255,0.15); }

    /* Выпадающее меню вокальных эффектов (50 штук) */
    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background: #1a1a24;
      border: 1px solid rgba(255,255,255,0.15);
      min-width: 260px;
      max-height: 400px;
      overflow-y: auto;
      box-shadow: 0 16px 32px rgba(0,0,0,0.8);
      border-radius: 14px;
      z-index: 200;
      padding: 8px;
    }

    .dropdown:hover .dropdown-content { display: grid; grid-template-columns: 1fr; gap: 4px; }

    .effect-item {
      padding: 8px 12px;
      font-size: 13px;
      color: #e2e8f0;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.15s;
    }
    .effect-item:hover { background: #6366f1; color: #fff; }

    .hint {
      position: fixed;
      bottom: 16px;
      left: 20px;
      background: rgba(15, 15, 20, 0.85);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 12px;
      color: #94a3b8;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <div class="tool-group">
      <button class="tool-btn active" id="btn-select" onclick="setMode('select')">👆 Выбор/Перенос</button>
      <button class="tool-btn" id="btn-draw" onclick="setMode('draw')">✏️ Карандаш</button>
      <button class="tool-btn" id="btn-eraser" onclick="setMode('eraser')">🧹 Ластик</button>
    </div>

    <div class="divider"></div>

    <!-- Полный каталог из 50 вокальных эффектов -->
    <div class="dropdown">
      <button class="tool-btn">🎤 Вокальные эффекты (50) ▾</button>
      <div class="dropdown-content" id="effects-list"></div>
    </div>

    <div class="divider"></div>

    <div class="tool-group">
      <button class="tool-btn" onclick="addChordPrompt()">🎼 Добавить аккорд</button>
      <button class="tool-btn" onclick="clearBoard()" style="color: #ef4444;">🗑 Сброс</button>
    </div>
  </div>

  <div class="hint">
    🖼 Перетащите скриншот в любое окно | 🔍 Зум: Колесико / Тачпад | ✋ Перемещение холста: Зажать правую кнопку мыши (ПКМ) и вести
  </div>

  <div id="board-container">
    <canvas id="board" oncontextmenu="return false;"></canvas>
  </div>

  <script src="resize.js"></script>
  <script src="app.js"></script>
</body>
</html>
