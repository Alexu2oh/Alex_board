<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fraza Board — Вокальная Доска</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #1e1e24; color: #fff; }
    
    #board-container { width: 100vw; height: 100vh; position: relative; cursor: crosshair; }
    canvas { display: block; position: absolute; top: 0; left: 0; }

    /* Панель инструментов (Заготовки / Суперсилы) */
    .toolbar {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 30, 36, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 16px;
      border-radius: 30px;
      display: flex;
      gap: 12px;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 100;
    }

    .tool-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      padding: 6px 14px;
      border-radius: 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tool-btn:hover {
      background: rgba(255,255,255,0.25);
      transform: translateY(-2px);
    }

    .tool-btn.active {
      background: #4f46e5;
      border-color: #6366f1;
    }

    /* Подсказка внизу */
    .hint {
      position: fixed;
      bottom: 16px;
      left: 16px;
      background: rgba(0,0,0,0.6);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      color: #aaa;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <button class="tool-btn active" id="btn-draw">✏️ Рисовать</button>
    <button class="tool-btn" id="btn-erase">🧹 Ластик</button>
    <div style="width: 1px; height: 20px; background: rgba(255,255,255,0.2);"></div>
    <button class="tool-btn" onclick="addShape('vibrato')">〰️ Вибрато</button>
    <button class="tool-btn" onclick="addShape('glissando')">↗️ Глиссандо</button>
    <button class="tool-btn" onclick="addShape('piano')">🎹 <i>p</i> (Тише)</button>
    <button class="tool-btn" onclick="addShape('forte')">🔊 <i>f</i> (Громче)</button>
    <button class="tool-btn" onclick="addShape('accent')">❯ Акцент</button>
  </div>

  <div class="hint">
    💡 Перетащи скриншот на экран | Зум: Колесико мыши / Щипок | Перемещение: Пробел + Зажать мышь
  </div>

  <div id="board-container">
    <canvas id="board"></canvas>
  </div>

  <script src="app.js"></script>
</body>
</html>
